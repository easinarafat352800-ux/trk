<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কর্মচারী কার্যক্রম মনিটর - Advanced Edition</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-section {
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
            display: none;
        }

        .content.active {
            display: grid;
        }

        .section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .link-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .link-info {
            flex: 1;
        }

        .link-info p {
            margin: 5px 0;
            color: #666;
            font-size: 13px;
        }

        .link-info .employee-name {
            color: #333;
            font-weight: 600;
            font-size: 15px;
        }

        .status {
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
        }

        .status.used {
            background: #f8d7da;
            color: #721c24;
        }

        .copy-btn {
            background: #28a745;
            padding: 8px 12px;
            font-size: 13px;
            width: auto;
            min-width: 80px;
            margin-left: 10px;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .activity-log {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
        }

        .activity-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            color: #555;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .time {
            color: #999;
            font-size: 12px;
            font-weight: 600;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .monitoring-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .monitoring-active {
            color: #28a745;
            font-size: 48px;
            margin-bottom: 20px;
        }

        .mic-button {
            background: #dc3545;
            padding: 15px 20px;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-top: 20px;
            cursor: pointer;
        }

        .mic-button:hover {
            background: #c82333;
        }

        .mic-button.active {
            background: #28a745;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .logout-btn {
            background: #dc3545;
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- লগইন সেকশন -->
    <div class="login-section" id="loginSection">
        <div class="container">
            <div class="header">
                <h1>🔐 লগইন করুন</h1>
                <p>Employee Monitoring System</p>
            </div>

            <div style="padding: 40px;">
                <!-- ট্যাব সিলেক্টর -->
                <div style="display: flex; gap: 10px; margin-bottom: 30px;">
                    <button onclick="switchTab('login')" id="loginTab" style="background: #667eea;">লগইন</button>
                    <button onclick="switchTab('register')" id="registerTab" style="background: #ddd; color: #333;">নিবন্ধন</button>
                </div>

                <!-- লগইন ফর্ম -->
                <div id="loginForm">
                    <div class="form-group">
                        <label>ইমেইল:</label>
                        <input type="email" id="loginEmail" placeholder="admin@company.com">
                    </div>

                    <div class="form-group">
                        <label>পাসওয়ার্ড:</label>
                        <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড">
                    </div>

                    <button onclick="login()">🔓 লগইন করুন</button>
                </div>

                <!-- নিবন্ধন ফর্ম -->
                <div id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label>পূর্ণ নাম:</label>
                        <input type="text" id="registerName" placeholder="আপনার নাম">
                    </div>

                    <div class="form-group">
                        <label>ইমেইল:</label>
                        <input type="email" id="registerEmail" placeholder="admin@company.com">
                    </div>

                    <div class="form-group">
                        <label>কোম্পানির নাম:</label>
                        <input type="text" id="registerCompany" placeholder="কোম্পানির নাম">
                    </div>

                    <div class="form-group">
                        <label>পাসওয়ার্ড:</label>
                        <input type="password" id="registerPassword" placeholder="শক্তিশালী পাসওয়ার্ড">
                    </div>

                    <div class="form-group">
                        <label>পাসওয়ার্ড নিশ্চিত করুন:</label>
                        <input type="password" id="registerPasswordConfirm" placeholder="পাসওয়ার্ড পুনরায় টাইপ করুন">
                    </div>

                    <button onclick="register()">✅ নিবন্ধন করুন</button>
                </div>

                <p style="margin-top: 20px; text-align: center; color: #666; font-size: 12px;">
                    ডেমো অ্যাকাউন্ট: admin@example.com / password123
                </p>
            </div>
        </div>
    </div>

    <!-- ড্যাশবোর্ড সেকশন -->
    <div class="container" id="dashboardContainer" style="display: none;">
        <button class="logout-btn" onclick="logout()">🔓 লগআউট</button>

        <div class="header">
            <h1>👨‍💼 ম্যানেজার ড্যাশবোর্ড</h1>
            <p id="companyName"></p>
        </div>

        <div class="content" id="dashboardContent">
            <!-- লিংক জেনারেশন -->
            <div class="section">
                <h2>🔗 নতুন মনিটরিং লিংক তৈরি করুন</h2>

                <div class="form-group">
                    <label>কর্মচারীর নাম:</label>
                    <input type="text" id="employeeName" placeholder="যেমন: আলী আহমেদ">
                </div>

                <div class="form-group">
                    <label>ইমেইল:</label>
                    <input type="email" id="employeeEmail" placeholder="employee@company.com">
                </div>

                <div class="form-group">
                    <label>বিভাগ:</label>
                    <select id="department">
                        <option value="">নির্বাচন করুন</option>
                        <option value="বিক্রয়">বিক্রয়</option>
                        <option value="আইটি">আইটি</option>
                        <option value="এইচআর">এইচআর</option>
                        <option value="প্রশাসন">প্রশাসন</option>
                        <option value="অন্যান্য">অন্যান্য</option>
                    </select>
                </div>

                <button onclick="generateLink()">🔗 লিংক তৈরি করুন</button>

                <div class="stats" style="margin-top: 20px;">
                    <div class="stat-box">
                        <div class="stat-number" id="activeLinksStat">0</div>
                        <div class="stat-label">সক্রিয় লিংক</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="usedLinksStat">0</div>
                        <div class="stat-label">ব্যবহৃত লিংক</div>
                    </div>
                </div>
            </div>

            <!-- লিংক লিস্ট -->
            <div class="section">
                <h2>📋 মনিটরিং লিংক সমূহ</h2>
                <div id="linksList"></div>
            </div>

            <!-- কার্যক্রম লগ (পূর্ণ প্রস্থ) -->
            <div class="section" style="grid-column: 1 / -1;">
                <h2>📊 রিয়েল-টাইম কার্যক্রম লগ</h2>
                <div class="activity-log" id="activityLog">
                    <div class="activity-item" style="text-align: center; color: #999;">
                        এখনও কোন কার্যক্রম নেই
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // কনফিগারেশন
        // =====================================================
        const API_URL = 'http://localhost:5000';
        let socket = null;
        let manager = null;
        let token = null;

        // =====================================================
        // API ফাংশন
        // =====================================================

        async function apiCall(endpoint, method = 'GET', body = null, useToken = true) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            if (useToken && token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }

            if (body) {
                options.body = JSON.stringify(body);
            }

            try {
                const response = await fetch(`${API_URL}${endpoint}`, options);
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'API Error');
                }
                return await response.json();
            } catch (error) {
                showNotification('❌ ' + error.message, 'error');
                throw error;
            }
        }

        // =====================================================
        // অথেন্টিকেশন
        // =====================================================

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                loginTab.style.background = '#667eea';
                loginTab.style.color = 'white';
                registerTab.style.background = '#ddd';
                registerTab.style.color = '#333';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                loginTab.style.background = '#ddd';
                loginTab.style.color = '#333';
                registerTab.style.background = '#667eea';
                registerTab.style.color = 'white';
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showNotification('❌ অনুগ্রহ করে সমস্ত ফিল্ড পূরণ করুন', 'error');
                return;
            }

            try {
                const response = await apiCall('/api/auth/login', 'POST', {
                    email,
                    password
                }, false);

                token = response.token;
                manager = response.manager;

                // লোকাল স্টোরেজে সংরক্ষণ করুন
                localStorage.setItem('token', token);
                localStorage.setItem('manager', JSON.stringify(manager));

                // UI আপডেট করুন
                showDashboard();
                showNotification('✅ লগইন সফল!');
            } catch (error) {
                console.error('Login error:', error);
            }
        }

        async function register() {
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const company = document.getElementById('registerCompany').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            if (!name || !email || !company || !password || !passwordConfirm) {
                showNotification('❌ অনুগ্রহ করে সমস্ত ফিল্ড পূরণ করুন', 'error');
                return;
            }

            if (password !== passwordConfirm) {
                showNotification('❌ পাসওয়ার্ড মিলছে না', 'error');
                return;
            }

            if (password.length < 6) {
                showNotification('❌ পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে', 'error');
                return;
            }

            try {
                const response = await apiCall('/api/auth/register', 'POST', {
                    name,
                    email,
                    company,
                    password
                }, false);

                token = response.token;
                manager = response.manager;

                localStorage.setItem('token', token);
                localStorage.setItem('manager', JSON.stringify(manager));

                showDashboard();
                showNotification('✅ নিবন্ধন সফল!');
            } catch (error) {
                console.error('Register error:', error);
            }
        }

        function logout() {
            token = null;
            manager = null;
            localStorage.removeItem('token');
            localStorage.removeItem('manager');

            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboardContainer').style.display = 'none';
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';

            showNotification('✅ লগআউট সফল');
        }

        // =====================================================
        // UI ফাংশন
        // =====================================================

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardContainer').style.display = 'block';
            document.getElementById('companyName').textContent = manager.name || 'ম্যানেজার';
            document.getElementById('dashboardContent').classList.add('active');

            // WebSocket সংযোগ করুন
            connectWebSocket();

            // লিংক লিস্ট লোড করুন
            loadLinks();

            // প্রতি ৫ সেকেন্ডে আপডেট করুন
            setInterval(loadLinks, 5000);
        }

        function connectWebSocket() {
            socket = io(API_URL, {
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: 5
            });

            socket.on('connect', () => {
                console.log('✅ WebSocket সংযুক্ত');
                socket.emit('manager-join', manager.id);
            });

            socket.on('activity-update', (data) => {
                addActivity(`${data.employeeName}: ${data.activity}`);
            });

            socket.on('disconnect', () => {
                console.log('❌ WebSocket ডিসকানেক্ট');
            });
        }

        // =====================================================
        // লিংক ম্যানেজমেন্ট
        // =====================================================

        async function generateLink() {
            const name = document.getElementById('employeeName').value.trim();
            const email = document.getElementById('employeeEmail').value.trim();
            const department = document.getElementById('department').value;

            if (!name || !email || !department) {
                showNotification('❌ অনুগ্রহ করে সমস্ত তথ্য পূরণ করুন', 'error');
                return;
            }

            try {
                const response = await apiCall('/api/links/generate', 'POST', {
                    name,
                    email,
                    department
                });

                const linkCode = response.link.code;
                const fullLink = `${window.location.origin}?link=${linkCode}`;

                showNotification(`✅ লিংক তৈরি হয়েছে: ${linkCode}`);

                // লিংক কপি করুন
                navigator.clipboard.writeText(fullLink);
                showNotification('📋 সম্পূর্ণ লিংক কপি হয়েছে!');

                // ফর্ম রিসেট করুন
                document.getElementById('employeeName').value = '';
                document.getElementById('employeeEmail').value = '';
                document.getElementById('department').value = '';

                // লিস্ট আপডেট করুন
                loadLinks();
            } catch (error) {
                console.error('Generate link error:', error);
            }
        }

        async function loadLinks() {
            try {
                const response = await apiCall('/api/links');
                const now = new Date();

                let html = '';
                response.links.forEach(link => {
                    const isExpired = new Date(link.expiresAt) < now;
                    const statusClass = link.used ? 'used' : (isExpired ? 'used' : 'active');
                    const statusText = link.used ? 'ব্যবহৃত' : (isExpired ? 'মেয়াদ শেষ' : 'সক্রিয়');

                    html += `
                        <div class="link-item">
                            <div class="link-info">
                                <p class="employee-name">${link.name}</p>
                                <p>${link.email}</p>
                                <p>বিভাগ: ${link.department}</p>
                            </div>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <span class="status ${statusClass}">${statusText}</span>
                                <button class="copy-btn" onclick="copyLink('${link.code}')">📋 কপি</button>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('linksList').innerHTML = html || '<p style="text-align: center; color: #999;">এখনও কোন লিংক তৈরি হয়নি</p>';

                // স্ট্যাটিসটিক্স আপডেট করুন
                document.getElementById('activeLinksStat').textContent = response.active;
                document.getElementById('usedLinksStat').textContent = response.used;
            } catch (error) {
                console.error('Load links error:', error);
            }
        }

        function copyLink(code) {
            const link = `${window.location.origin}?link=${code}`;
            navigator.clipboard.writeText(link).then(() => {
                showNotification('📋 লিংক কপি হয়েছে!');
            });
        }

        // =====================================================
        // কার্যক্রম লগ
        // =====================================================

        function addActivity(text) {
            const time = new Date().toLocaleTimeString('bn-BD');
            let html = `
                <div class="activity-item">
                    <div class="time">${time}</div>
                    <div>${text}</div>
                </div>
            `;

            const activityLog = document.getElementById('activityLog');
            const firstItem = activityLog.querySelector('.activity-item');

            if (firstItem && firstItem.textContent.includes('এখনও কোন')) {
                activityLog.innerHTML = html;
            } else {
                activityLog.innerHTML = html + activityLog.innerHTML;
            }
        }

        // =====================================================
        // বিজ্ঞপ্তি
        // =====================================================

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;

            if (type === 'error') {
                notification.style.background = '#dc3545';
            }

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // =====================================================
        // পৃষ্ঠা লোড
        // =====================================================

        window.addEventListener('load', () => {
            // সংরক্ষিত টোকেন চেক করুন
            const savedToken = localStorage.getItem('token');
            const savedManager = localStorage.getItem('manager');

            if (savedToken && savedManager) {
                token = savedToken;
                manager = JSON.parse(savedManager);
                showDashboard();
            }
        });
    </script>
</body>
